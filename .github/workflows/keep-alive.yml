name: Backend Health Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check EZmart backend
        run: |
          curl -fL --retry 3 --retry-delay 10 --max-time 120 \
          https://welcome-bakery-1.onrender.com/api/health